<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fubon Demo - 帳戶管理</title>
</head>

<body>
    <h1>帳戶管理示範</h1>

    <section>
        <h2>線上開戶</h2>
        <form id="open-account-form">
            <input name="full_name" placeholder="全名" required />
            <input name="id_number" placeholder="身分證號" required />
            <input name="email" placeholder="email" />
            <input name="initial_deposit" placeholder="初始存款" type="number" />
            <button type="submit">送出申請</button>
        </form>
        <pre id="open-account-result"></pre>
    </section>

    <section>
        <h2>信用卡申請</h2>
        <form id="cc-form">
            <input name="full_name" placeholder="全名" required />
            <input name="id_number" placeholder="身分證號" required />
            <input name="annual_income" placeholder="年收入" type="number" />
            <input name="card_type" placeholder="卡別 (e.g. gold)" />
            <button type="submit">申請</button>
        </form>
        <pre id="cc-result"></pre>
    </section>

    <section>
        <h2>註冊網路銀行</h2>
        <form id="register-form">
            <input name="username" placeholder="帳號" required />
            <input name="password" type="password" placeholder="密碼" required />
            <input name="email" placeholder="email" />
            <button type="submit">註冊</button>
        </form>
        <pre id="register-result"></pre>
    </section>

    <script>
        const api = (path, data) => fetch(path, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
        }).then(r => r.json().then(js => ({ status: r.status, body: js })).catch(() => ({ status: r.status }))).catch(e => ({ error: e.message }));

        document.getElementById('open-account-form').addEventListener('submit', async e => {
            e.preventDefault();
            const f = e.target; const data = { full_name: f.full_name.value, id_number: f.id_number.value, email: f.email.value, initial_deposit: Number(f.initial_deposit.value) };
            const res = await api('/api/accounts/open', data);
            document.getElementById('open-account-result').textContent = JSON.stringify(res, null, 2);
        });

        document.getElementById('cc-form').addEventListener('submit', async e => {
            e.preventDefault();
            const f = e.target; const data = { full_name: f.full_name.value, id_number: f.id_number.value, annual_income: Number(f.annual_income.value), card_type: f.card_type.value };
            const res = await api('/api/creditcards/apply', data);
            document.getElementById('cc-result').textContent = JSON.stringify(res, null, 2);
        });

        document.getElementById('register-form').addEventListener('submit', async e => {
            e.preventDefault();
            const f = e.target; const data = { username: f.username.value, password: f.password.value, email: f.email.value };
            const res = await api('/api/users/register', data);
            document.getElementById('register-result').textContent = JSON.stringify(res, null, 2);
        });
    </script>
</body>

</html>
